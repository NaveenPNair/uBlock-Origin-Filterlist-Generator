name: Update the combo list
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 18 * * *'
    - cron: '30 22 * * *'
    - cron: '30 2 * * *'
    - cron: '30 6 * * *'
    - cron: '30 10 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch:
jobs:
  mkcombo:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.2.2  # Bumped for Node 24 support
    - name: Set up Python
      uses: actions/setup-python@v5.3.0 # Bumped for Node 24 support
      with:
        python-version: '3.12' # Using a specific stable version
    - name: Build
      run: |
        echo "Updating dependencies..."
        pip3 install --upgrade pip
        pip3 install requests publicsuffixlist
        
        echo "Generating aggregated filterlist..."
        python combo.py
    - name: Commit & Push
      run: |
        git config user.name "Update bot"
        git config user.email "updatebot@naveenpnair.github.io"
        git add .
        # Only commit if there are changes to avoid empty-commit errors
        git diff --staged --quiet || (git commit -m "Update the combo list" && git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }} HEAD:main)
